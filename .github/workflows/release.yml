name: Cross-platform release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/release_artifacts.py --check-version
  validate:
    needs: version
    uses: ./.github/workflows/cross-platform.yml
    secrets: inherit
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Verify artifacts and publish release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_artifacts.py --publish
