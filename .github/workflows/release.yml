name: Windows release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag and version.json differ' }
      - name: Install art dependencies
        run: python -m pip install -r tools/art_pipeline/requirements.txt
      - name: Install Inno Setup
        shell: pwsh
        run: ./tools/install-inno.ps1
      - name: Validate, test, publish and package
        shell: pwsh
        run: ./tools/release.ps1
      - name: Smoke test self-contained application
        run: python tools/smoke_test.py dist/publish/PixelRick.exe
      - name: Test installer lifecycle
        run: python tools/installer_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: PixelRick-Windows
          path: |
            dist/PixelRick-Setup.exe
            dist/PixelRick-Portable.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' dist/PixelRick-Setup.exe dist/PixelRick-Portable.zip dist/SHA256SUMS.txt --title 'PixelRick ${{ github.ref_name }}' --notes-file RELEASE_NOTES.md --verify-tag
